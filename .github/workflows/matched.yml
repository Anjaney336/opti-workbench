name: Matched CVaR research checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-matched.txt
      - run: python test_matched_benchmark.py
      - run: python matched_benchmark.py
